name: pruebas

on: [push, pull_request]

jobs:
  unitarias:
    name: Unitarias y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear .env de unitarias
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=http://127.0.0.1:3000
          APP_NAME="UniBudget"
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=pre_estudiantil
          SERVER_PORT=3000
          EOF

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Pruebas unitarias
        run: flutter test --coverage --reporter expanded

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage/lcov.info

  e2e:
    name: E2E Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: unitarias

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pre_estudiantil
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pre_estudiantil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servidor/package-lock.json

      - name: Crear .env de CI
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=http://10.0.2.2:3000
          APP_NAME="UniBudget"
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=pre_estudiantil
          SERVER_PORT=3000
          EOF

      - name: Dependencias Flutter
        run: flutter pub get

      - name: Dependencias API y migraciones
        working-directory: servidor
        run: |
          npm ci
          npx prisma migrate deploy
          node prisma/semilla.js

      - name: Habilitar KVM
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Pruebas E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: nohup node servidor/servidor.js > api.log 2>&1 & sleep 5; for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ping >/dev/null && break; sleep 2; done; flutter test integration_test -d emulator-5554 --reporter expanded
