name: pruebas

on: [push, pull_request]

jobs:
  unitarias:
    name: Unitarias y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear .env de unitarias
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=http://127.0.0.1:3000
          APP_NAME="UniBudget"
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=pre_estudiantil
          SERVER_PORT=3000
          EOF

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Dependencias Flutter
        run: flutter pub get

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Habilitar flags en pnpm
        run: |
          PNPM_BIN=$(which pnpm)
          sudo mv "$PNPM_BIN" "${PNPM_BIN}_real"
          sudo tee "$PNPM_BIN" > /dev/null <<'EOF'
          #!/bin/sh
          if [ "$1" = "test" ]; then
            shift
            exec "${0}_real" run test "$@"
          else
            exec "${0}_real" "$@"
          fi
          EOF
          sudo chmod +x "$PNPM_BIN"

      - name: Pruebas unitarias
        run: pnpm test --coverage

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage/lcov.info

  e2e:
    name: E2E Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: unitarias

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pre_estudiantil
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pre_estudiantil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servidor/package-lock.json

      - name: Crear .env de CI
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=http://10.0.2.2:3000
          APP_NAME="UniBudget"
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=pre_estudiantil
          SERVER_PORT=3000
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/pre_estudiantil?schema=public"
          EOF
          cp .env servidor/.env

      - name: Dependencias Flutter
        run: flutter pub get

      - name: Dependencias API y migraciones
        working-directory: servidor
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/pre_estudiantil?schema=public"
        run: |
          npm ci
          npx prisma migrate deploy
          node prisma/semilla.js

      - name: Habilitar KVM
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Pruebas E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            (cd servidor && nohup node servidor.js > ../api.log 2>&1 &)
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/ping >/dev/null 2>&1; then
                echo "Servidor listo en el intento $i"
                break
              fi
              echo "Esperando servidor... $i"
              sleep 2
            done
            curl -fsS http://127.0.0.1:3000/ping || (echo "=== LOG SERVIDOR ===" && cat api.log && exit 1)
            DEVICE=$(adb devices | grep -m1 'emulator-' | awk '{print $1}')
            DEVICE=${DEVICE:-emulator-5554}
            echo "Ejecutando pruebas E2E en dispositivo: $DEVICE"
            flutter test integration_test -d "$DEVICE" --reporter expanded

      - name: Subir log de API si falla
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-log
          path: api.log
