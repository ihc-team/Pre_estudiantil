name: pruebas

# E2E Android no se ejecuta en GitHub Actions.
# El emulador de Android se queda colgado en el teardown y agota el timeout
# del job, aunque las pruebas terminen. Para ejecutar E2E manualmente:
#   docker compose -f docker-compose.dev.yml up -d
#   flutter test integration_test -d <ID_DEL_EMULADOR>

on: [push, pull_request]

jobs:
  unitarias:
    name: Unitarias y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear .env de unitarias
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=http://127.0.0.1:3000
          APP_NAME="UniBudget"
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=pre_estudiantil
          SERVER_PORT=3000
          EOF

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Dependencias Flutter
        run: flutter pub get

      - name: Pruebas unitarias
        run: flutter test --coverage --reporter expanded

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage/lcov.info
