server {
    listen 80 default_server;
    server_name _;
    return 301 https://presupuesto.sebaces.fyi$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name presupuesto.sebaces.fyi;

    ssl_certificate     /etc/letsencrypt/live/presupuesto.sebaces.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/presupuesto.sebaces.fyi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20M;

    # La app web usa API_BASE_URL=/api. El slash final quita /api/ antes
    # de enviar la petición al backend, cuyas rutas son /login, /metas, etc.
    location /api/ {
        proxy_pass http://pre_estudiantil-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /ping {
        proxy_pass http://pre_estudiantil-api:3000/ping;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://pre_estudiantil-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
