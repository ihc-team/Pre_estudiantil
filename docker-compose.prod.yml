name: pre_estudiantil_prod

services:
  # ---------- PostgreSQL (solo red interna) ----------
  pre_estudiantil-db:
    image: postgres:16-alpine
    container_name: pre_estudiantil_db_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pre_estudiantil_db_prod_data:/var/lib/postgresql/data
    networks:
      - pre_estudiantil-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- API Express + Prisma (sin puerto público) ----------
  pre_estudiantil-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: sebastiandevjs/pre_estudiantil-api:latest
    container_name: pre_estudiantil_api_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVER_PORT: 3000
      DB_HOST: pre_estudiantil-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      pre_estudiantil-db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - pre_estudiantil-net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ping >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # ---------- Flutter Web (build + nginx interno) ----------
  pre_estudiantil-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: /api

    image: sebastiandevjs/pre_estudiantil-web:latest
    container_name: pre_estudiantil_web_prod
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "80"
    networks:
      - pre_estudiantil-net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Nginx de borde: única puerta de entrada ----------
  pre_estudiantil-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: sebastiandevjs/pre_estudiantil-nginx:latest
    container_name: pre_estudiantil_nginx_prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - "${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro"
    depends_on:
      pre_estudiantil-web:
        condition: service_healthy
      pre_estudiantil-api:
        condition: service_healthy
    networks:
      - pre_estudiantil-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/ping >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pre_estudiantil_db_prod_data:

networks:
  pre_estudiantil-net:
    name: pre_estudiantil-net-prod
    driver: bridge
