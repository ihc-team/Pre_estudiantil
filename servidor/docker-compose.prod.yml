name: pre_estudiantil_prod

services:
  # ---------- PostgreSQL (solo red interna) ----------
  pre_estudiantil-db:
    image: postgres:16-alpine
    container_name: pre_estudiantil_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # En un despliegue real define DB_PASSWORD y quita esta línea
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pre_estudiantil_db_prod_data:/var/lib/postgresql/data
    networks:
      - pre_estudiantil-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- API Express + Prisma (sin puerto público) ----------
  pre_estudiantil-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pre_estudiantil_api_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUERTO: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@pre_estudiantil-db:5432/${DB_NAME}?schema=public
    depends_on:
      pre_estudiantil-db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - pre_estudiantil-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # ---------- Nginx: única puerta de entrada HTTP ----------
  pre_estudiantil-nginx:
    image: nginx:alpine
    container_name: pre_estudiantil_nginx_prod
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      pre_estudiantil-api:
        condition: service_healthy
    networks:
      - pre_estudiantil-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pre_estudiantil_db_prod_data:

networks:
  pre_estudiantil-net:
    name: pre_estudiantil-net-prod
    driver: bridge
